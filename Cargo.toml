[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OATS maintainers <maintainers@oatschema.org>"]
repository = "https://github.com/oatschema/oatschema-rs"

[package]
name = "oatschema"
version = "0.0.2"
description = "OATS (Open Annotation Task Schemas) JSON schemas, bundled for Rust."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://oatschema.org"
documentation = "https://docs.rs/oatschema"
readme = "README.md"
keywords = ["oats", "json-schema", "schema", "annotation", "machine-learning"]
categories = ["encoding", "science"]
include = ["/src/**/*.rs", "/tests/**/*.rs", "/schemas/**/*.json", "/README.md", "/CHANGELOG.md", "/LICENSE", "/AUTHORS"]

[features]
serde_json = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1.0.100", optional = true }

[dev-dependencies]
jsonschema = { version = "=0.59.0", default-features = false }
serde_json = "1.0.100"
sha2 = "0.10.8"

[package.metadata.docs.rs]
all-features = true
