name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/oatschema
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "oatschema") | .version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
      - name: Skip a version that is already on crates.io
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --user-agent "oatschema-rs release workflow (https://github.com/oatschema/oatschema-rs)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/oatschema/$version")"
          case "$status" in
            200)
              echo "oatschema $version is already on crates.io; skipping publish"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io answered HTTP $status for oatschema $version" >&2
              exit 1
              ;;
          esac
      - if: steps.published.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.published.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
